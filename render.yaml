services:
  - type: web
    name: hnd-platform-backend
    env: docker
    rootDir: hnd_backend
    dockerfilePath: Dockerfile
    autoDeploy: true
    plan: free
    envVars:
      - key: LIBREOFFICE_PATH
        value: /usr/bin/soffice
      - key: CONVERTER_BASE_URL
        value: https://acadex-converter.onrender.com
      - key: CONVERTER_SECRET
        value: TheBillions11
      - key: CONVERTER_SHARED_SECRET
        value: TheBillions11

  - type: web
    name: hnd-platform-converter
    env: docker
    rootDir: docker_converter
    dockerfilePath: Dockerfile
    autoDeploy: true
    plan: free
    envVars:
      - key: LIBREOFFICE_PATH
        value: /usr/bin/soffice
      - key: CONVERTER_SECRET
        value: TheBillions11
      - key: CONVERTER_SHARED_SECRET
        value: TheBillions11
