name: API Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ping Health Endpoint
        run: |
          set -e
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            BACKEND_HEALTH_URL="https://your-railway-backend-url/api/health"
          fi
          echo "Pinging $BACKEND_HEALTH_URL"
          http_code=$(curl -fsS -o /dev/null -w "%{http_code}" "$BACKEND_HEALTH_URL")
          echo "HTTP Response Code: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "Health endpoint returned $http_code" >&2
            exit 1
          fi
