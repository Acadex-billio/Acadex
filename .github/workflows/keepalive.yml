name: API Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ping Health Endpoint
        run: |
          set -e
          echo "Pinging https://acadex-hng2.onrender.com/api/health"
          http_code=$(curl -fsS -o /dev/null -w "%{http_code}" https://acadex-hng2.onrender.com/api/health)
          echo "HTTP Response Code: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "Health endpoint returned $http_code" >&2
            exit 1
          fi
